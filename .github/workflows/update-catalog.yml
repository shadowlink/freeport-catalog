name: Update catalog

on:
  schedule:
    - cron: "0 6 * * *"   # cada día a las 06:00 UTC
  workflow_dispatch: {}   # ejecución manual desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Probe GitHub Releases → refresh cached fields
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/probe.py catalog.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Sin cambios en el catálogo."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "chore: refresh catalog cached fields (probe.py)"
            git push
          fi
